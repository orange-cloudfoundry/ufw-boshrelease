name: create-final-bosh-release

permissions:
  contents: write # allow git push to repo (blobs.yml refresh) and the github release and its artefact

on:
  workflow_dispatch: # manual triggering to be able to create a release even on change on other paths
  push:
    branches:
      - main
    paths: # only trigger on bosh-relevant changes
      - .final_builds/**
      - config/**
      - jobs/**
      - packages/**
      - releases/**
      - vendir.yml

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install bosh-cli
        #See https://github.com/marketplace/actions/install-a-binary-from-github-releases
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: cloudfoundry/bosh-cli
          tag: v7.11.1
          extension-matching: disable
          chmod: 0755
          rename-to: bosh

      - name: Install vendir cli
        #See https://github.com/marketplace/actions/install-a-binary-from-github-releases
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: carvel-dev/vendir
          tag: v0.46.3
          extension-matching: disable
          chmod: 0755
          rename-to: vendir

      - name: Install yq cli
        #See https://github.com/marketplace/actions/install-a-binary-from-github-releases
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: mikefarah/yq
          tag: v4.54.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # reduce potential rate limiting

      - name: vendor-add-blob
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_BOSH_ACCES_KEY_ID: ${{ secrets.AWS_BOSH_ACCES_KEY_ID }}
          AWS_BOSH_SECRET_ACCES_KEY: ${{ secrets.AWS_BOSH_SECRET_ACCES_KEY }}
        run: |
          set -x # enable traces
          set -e -o pipefail
          # configure git
          git config --global user.name "workflows/ufw-boshrelease/create-final-bosh-release"
          git config --global user.email "<>"
          git config --global --add safe.directory /github/workspace
          ./vendor.sh
          echo "State after vendir:"
          tree -s src
          git add vendir.lock
          ./addblob.sh
          remote_repo="https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"

          git add config/blobs.yml
          git status
          if git commit -a --dry-run 2>&1 >/dev/null;then
            git commit -a -m "updating blobs" && \
              git push ${remote_repo} HEAD:${GITHUB_REF_NAME}
          else
            echo "Nothing to commit"
          fi

      - name: Extract ufw version from vendir url
        id: extract_version
        run: |
          set -e -o pipefail
          url=$(yq '.directories[0].contents[0].http.url' vendir.yml)
          version=$(echo "${url}" | sed -E 's#.*/ufw_([^_]+)\.orig\.tar\.gz#\1#')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "extracted upstream version: ${version}"

      - name: create bosh final release
        id: create-bosh-release
        uses: orange-cloudfoundry/create-bosh-release-action@1e04544761a0f457bf3c2116a1701926b30e622d # v1.2.5
        with:
          target_branch: ${{github.ref_name}}
          tag_name: ${{ steps.extract_version.outputs.version }}
          override_existing: true # allow deletion of existing tags
          force_version_consistency: true # to force tag_name without 'v' prefix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AWS_BOSH_ACCES_KEY_ID: ${{ secrets.AWS_BOSH_ACCES_KEY_ID }}
          AWS_BOSH_SECRET_ACCES_KEY: ${{ secrets.AWS_BOSH_SECRET_ACCES_KEY }}

      # see https://github.com/ncipollo/release-action
      - name: create github release
        id: create-github-release
        if: ${{ steps.create-bosh-release.outputs.need_gh_release == 'true' }}
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ steps.create-bosh-release.outputs.version }}
          draft: false
          allowUpdates: true
          omitDraftDuringUpdate: true
          generateReleaseNotes: true
          artifacts: ./${{ steps.create-bosh-release.outputs.file }}
          artifactContentType: application/zip
          removeArtifacts: true
          artifactErrorsFailBuild: true
