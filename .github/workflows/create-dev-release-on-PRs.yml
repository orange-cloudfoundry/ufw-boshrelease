name: create-dev-release-on-PRs

on:
  push:
    branches-ignore:
      - main
    tags-ignore:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install bosh-cli
        #See https://github.com/marketplace/actions/install-a-binary-from-github-releases
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: cloudfoundry/bosh-cli
          tag: v7.11.1
          extension-matching: disable
          chmod: 0755
          rename-to: bosh

      - name: Install vendir cli
        #See https://github.com/marketplace/actions/install-a-binary-from-github-releases
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: carvel-dev/vendir
          tag: v0.46.2
          extension-matching: disable
          chmod: 0755
          rename-to: vendir

      - name: Install yq cli
        #See https://github.com/marketplace/actions/install-a-binary-from-github-releases
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: mikefarah/yq
          tag: v4.54.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # reduce potential rate limiting

      - name: vendor-add-blob
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e -o pipefail
          git config --global --add safe.directory /github/workspace
          ./vendor.sh
          # no blobstore credentials on PRs: blobs stay in local blobs/ and are embedded in the dev tarball
          ./addblob.sh

      - name: create bosh dev release
        run: |
          set -e -o pipefail
          bosh create-release --name ufw --version "0.0.0-dev+$(git rev-parse --short HEAD)" --tarball ./ufw-dev-release.tgz --force

      - name: Archive bosh dev release tgz
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-bosh-dev-release-tgz
          path: |
            ufw-dev-release.tgz
