---
# Scratch manifest to smoke-test the release standalone (no runtime-config add-on) with enforcement enabled.
# Usage (see README for the dev-release flow):
#   bosh deploy manifests/ufw-enforce.yml \
#     -v internal_supernet=192.168.0.0/16 -v apps_subnet=10.20.30.0/24
name: ufw-test
releases:
- name: ufw
  version: latest
stemcells:
- alias: default
  os: ubuntu-noble
  version: latest
update:
  canaries: 1
  max_in_flight: 1
  canary_watch_time: 1000-60000
  update_watch_time: 1000-60000
instance_groups:
- name: firewall-test
  instances: 1
  azs: [z1]
  stemcell: default
  vm_type: default
  networks:
  - name: default
  jobs:
  - name: ufw
    release: ufw
    properties:
      ufw:
        enforce: true
        allow_bosh:
        - description: ssh from internal network (jumpbox/operators)
          from: ["((internal_supernet))"]
          to_ports: [22]
          protocol: tcp
        - description: node exporter scrape from monitoring (environment port)
          from: ["((internal_supernet))"]
          to_ports: [9099]
          protocol: tcp
        - description: bosh-dns health server from peers
          from: ["((internal_supernet))"]
          to_ports: [8853]
          protocol: tcp
        rules:
        - description: ssh from apps subnet (smoke rule)
          from: ["((apps_subnet))"]
          to_ports: [22]
          protocol: tcp
